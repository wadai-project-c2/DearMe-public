[project]
name = "dearme-backend"
version = "0.1.0"
description = "DEAR MEの画像加工、3D化連携、保存処理を担当するAPI"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.35,<2",
    "fastapi>=0.115,<1",
    "mangum>=0.17,<1",
    "openai>=1.68,<3",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6,<3",
    "python-dotenv>=1.0,<2",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
